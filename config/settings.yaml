window: {start: 2016, end: 2026, partial_year: 2026, cagr_end: 2025}

openalex:
  base_url: https://api.openalex.org
  per_page: 200
  or_batch: 100                  # max values in one OR filter
  budget_stop_fraction: 0.90     # stop when 90% of the daily $ budget is used
  sleep_s: 0.12                  # pause between live calls
  max_retries: 6
  cache_dir: data/cache/openalex

work_filter:
  include_work_types: [article, review, letter, conference-paper]
  include_source_types: [journal, conference]
  exclude_retracted: true
  # Also link a faculty authorship that has NO institution data when the author's own OpenAlex profile places
  # them at the lab in that year. Off = plan D4 exactly. S05 reports how many papers this would add.
  link_by_profile_years: false

matching:
  auto_accept_score: 92
  review_min_score: 70
  min_years_at_lab_in_window: 1

networks:
  max_authors_for_pairs: 50      # plan D16
  pagerank_alpha: 0.85
  louvain_seed: 42
  louvain_resolution: 1.0
  betweenness_k_internal: 1000
  dashboard_citation_nodes: 300
  dashboard_internal_nodes: 600

connections:
  count_csir_academy_as_partner: false   # plan D11 (AcSIR)
  jaccard_top_k_topics: 100
  jaccard_top_partners: 30

quartile:
  mode: year_matched            # or: latest
  sjr_dir: data/manual/sjr
  core_file: data/manual/core/CORE2023.csv

verify:
  count_tolerance: 0.15         # S00 warns when a lab's work count drifts more than this

paths:
  cache: data/cache
  interim: data/interim
  manual: data/manual
  review: data/review
  submission: outputs/submission
  stats: outputs/stats
  networks: outputs/networks
  figures: outputs/figures
  report: outputs/report

# Phase II (instructor's additional directions, step s16)
phase2:
  if_thresholds: [5, 10]            # "Q1 papers in journals with IF > 5 and IF > 10"
  multi_author_min: 10              # papers are classified as fewer than this many authors, or this many or more
  hyper_author_min: 100             # "hyperauthored": citations from such papers are tracked and flagged
  mega_author_min: 1000
  faculty_flag_share_hyper: 0.25    # flag a faculty member when this share of citations comes from hyperauthored papers
  faculty_flag_share_multi: 0.60    # ... or this share from papers with multi_author_min or more authors
  faculty_flag_min_citations: 100   # ... but only for faculty with at least this many citations (small totals are noise)
  citer_min_cites: 150              # a citing institution is "heavy" from this many citations received by our labs
  citer_ratio_min: 15               # ... and "citation-heavy relative to collaboration" from this many citations per shared paper
  citer_detail_top: 40              # citing institutions examined in detail (authors, journals) through OpenAlex
  # size-normalised view of the heavy citers: citations to the labs per 1,000 papers of the citing institution
  citer_norm_min_cites: 30          # institutions with at least this many citations to the scope are compared
  citer_norm_min_works: 300         # ... and at least this many papers in the labs' fields (smaller bases are not assessed)
  citer_norm_z: 2.0                 # outlier = robust z-score of log10(rate) at or above this
  citer_norm_fields: [11, 13, 16, 24, 27, 28, 30]   # OpenAlex fields that hold ~88% of the labs' papers (agri/bio, biochem/genetics, chemistry, immuno/micro, medicine, neuro, pharma)
  inst_network_nodes: 45            # partner institutions drawn in the institutional network (plus the four labs)
  jcr_file: data/manual/jcr/jcr_impact_factors.csv
  scimago_dir: data/manual/sjr_full   # full Scimago download(s); newest scimagojr_<year>.csv is used for Cites/Doc (2y)
  ownership_file: data/manual/institution_ownership.csv
  notes_file: data/manual/phase2_notes.yaml

