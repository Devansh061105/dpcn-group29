overview: "We find 6,063 distinct papers from 2016 to 2026 by 274 faculty members who have at least one paper (roster 294). CDRI is largest with 2,699 papers and 116 faculty, against 1,204 papers and 54 faculty at CCMB; lab counts add up to more than the total because shared papers are counted once under ALL. Of the 5,807 journal papers with a known quartile, 3,840 (66%) are Q1, ranging from 76.5% at IMTECH to 62.5% at IGIB. Q1 papers in journals with impact factor above 5 number 1,221 (32% of Q1) and above 10 number 277 (7%), but 16% of journal papers lie within 10% of those lines, so these counts are sensitive, and the impact factor is mostly JCR 2024 (1,327 of 1,568 journals) with Scimago or OpenAlex substitutes for 214 journals. Papers with fewer than 10 authors are 77% and those with 10 to 99 are 23%; only 26 papers have 100 or more authors, yet they hold 12% of citations. Yearly output stays between 475 and 640 papers in 2016-2025, and 2026 (382) is partial. Collaborating institutions per year range from 355 to 2,056 when every paper counts but only 333 to 674 without 100+ author papers, so consortium papers drive the spikes; we see no clear upward trend in the lower series."   # institutional overview: totals, Q1 with IF > 5 and IF > 10, author-count classes, yearly trend
faculty: "We find that citations are more concentrated than output across the 274 faculty. The ten most productive hold 16.6% of faculty-paper credits (1,344 of 8,107), while the ten most cited hold 23.5% of citations (47,851 of 203,767) and the top 27 (10%) hold 43.9%. Sidharth Chopra (185 papers), Vinod Scaria and Mohammed Faruq lead on papers, G. Swarup, Puran Singh Sijwali and G R Chandak on citations, and Kalyan Mitra (51 co-author links) and Jiaur R Gayen on connectivity, so the same people do not lead on all three; the top-10 lists for citations and for co-author links share nobody, and all ten most connected are in CDRI. Forty faculty are flagged (15 by the 100+ author rule, 37 by the 10+ author rule, 12 by both), including 8 of the ten most cited, and they hold 34% of all citations. Their totals largely reflect a few consortium papers, so we do not read them as individual impact; without the flagged, Ritushree Kukreti and Gajendra P. S. Raghava head the citation list. IGIB has the highest flag rate (18 of 55). Very large partner-institution counts may come from long consortium bylines rather than personal collaboration. Caveat: 32 faculty have under five papers, so their ratios are unstable."   # faculty comparison: who is most productive / connected, and what the flags mean
journals: "Across 6,050 journal papers, Scientific Reports is the most used venue (182 papers, 3.0%) and ranks first for CCMB, IGIB and IMTECH, but CDRI differs: its leading journals are chemistry titles, European Journal of Medicinal Chemistry (59), Organic Letters (55) and The Journal of Organic Chemistry (46). Publishing is fairly diffuse, with the ten most used journals holding 711 papers (11.8%), from 13.9% for IGIB to 26.6% for IMTECH. The impact factor distribution is right-skewed: 77.8% of papers are in journals below IF 5, 63.5% between 2 and 5, only 280 (4.6%) above 10 and 44 at 20 or more. The top 30 is filled by a few elite journals (13 Nature, 6 Science, 3 Nature Medicine, 3 Cell, 2 Nature Biotechnology; IF 35.6 to 50). Nine of the 30 have 100 or more authors (up to 632), and 17 involve a CCMB author, 12 IGIB, 4 CDRI and none IMTECH. A few entries look like short commentary, and one may be a conference abstract inheriting its journal's IF. Caveat: 91.7% of papers use JCR 2024 and 4.5% an OpenAlex proxy; ranking by Scimago Cites/Doc instead would put 2,100 rather than 1,253 papers above IF 5 on the same set, while the count above 10 barely moves (287 versus 271)."   # journals and top papers by impact factor
networks: "Among the most connected institutions shown in the Indian-only network (45 partners), medical institutes carry the most joint papers with the labs (669, 26% of lab-partner paper links), ahead of other CSIR labs (478), other universities (381) and central universities (321); IITs add only 85 (67 with CDRI, none with IMTECH). Each lab has its own leading partner: AIIMS for IGIB (229 papers), KGMU for CDRI (130), IICT for CCMB (96) and Panjab University for IMTECH (72), and only two partners appear in the top five of more than one lab. Yet 29 of the 45 partners have at least one joint paper with all four labs and just one with a single lab, so the pool is shared while the weight is lab-specific. The faculty network grows from 129 active faculty and density 0.026 in 2016 to 254 and 0.041 cumulatively, the largest component rising from 52% to 96% of faculty. It has 31 communities (modularity 0.54), the five largest each dominated by one lab, and cross-lab links are only 98 of 1,311 (7.5%). Of 9,634 citations among our papers, 97.9% stay within a lab. Indian citations into the labs (25,302) trail those out (29,304), though inflow overtook outflow from 2023. The 2021 link spike (251 of 345 at CDRI) may reflect one large paper, and 2026 is partial."   # institutional network and the networks over time
hyperauthorship: "We find that the 1,412 papers with 10 or more authors are 23.3% of the 6,063 papers but carry 34.5% of the 144,139 citations, and the 26 papers with 100 or more authors are only 0.4% of papers yet hold 17,590 citations (12.2%). The two papers with over 1,000 authors, both autophagy guidelines, are 0.03% of papers and 5.9% of citations. Most of the 26 are genomics consortia (type 2 diabetes, lipids, height, kidney function), SARS-CoV-2 virology and Phenome India cohort papers, seven of them in Nature. Fifteen of the 218 faculty with at least 100 citations are flagged for drawing 25% or more of their citations from such papers: 6 at CCMB, 6 at IGIB, 3 at IMTECH and none at CDRI; 40 faculty are flagged under either rule. If the 100+ author papers are set aside, the four faculty ranked 1 to 4 by citations fall to ranks 46 to 147 among 274, and only 5 of the top 10 stay in the top 10. A faculty member in such a consortium may contribute only a small part, so these citations may not reflect individual impact. We recommend reporting citations with and without these papers, and considering fractional counting. Caveat: the thresholds are conventions and the counts come from OpenAlex."   # papers and faculty flagged for many-author citations
citers: "We find 92 institutions with at least 150 citations to the four labs; 28 are private and 19 of those also receive at least 15 citations per co-authored paper. Their median is 43.4 citations per shared paper (range 17.9 to 171.0), against 3.5 for AIIMS and 10.5 across the 11 heavy IITs, about twelve and four times higher. Saveetha (695 citations, 16 shared papers) and Lovely Professional University (455, 10) lead by volume; Siksha O Anusandhan (171 on one shared paper) and Chitkara (109.3) lead by ratio. Jamia Hamdard (government-aided, 16.5) is outside this set. In the citing-paper evidence the commonest pattern is review articles: 17 of 19 exceed the 19.6 percent median of other heavy citers. One journal above 5 percent applies to 7 (12 top venues are Elsevier or Springer book series); one author on at least 15 percent of citing papers applies to 5; a shared author on at least 25 percent of citations applies to 2. Amity Gurugram (26.3 percent one author) and Sharda (19.0) look most explained by one author, while Saveetha, Vellore Institute of Technology and Siksha O Anusandhan stay unexplained, with no author or journal above 10 percent. We could not check topic overlap or institutional output size, absent from the files; the patterns may reflect review-heavy publishing, not intent. Caveat: counts use the 13 October snapshot, the evidence was fetched on 5 November, four of the 19 ownership classes are only partly verified, and split OpenAlex records understate totals."   # heavy citing institutions, non-government ones, and the reasons found
