# STATUS: drafts rewritten on 2026-11-20 from outputs/stats/p2_*.csv and research_*.csv after the cleaning and roster
# fixes (6,027 papers). Each figure was checked against those files, but the reading of them has to be the team's
# own: read each paragraph against the dashboard, change what you disagree with, and put it in your own words.
overview: 'We find 6,027 distinct papers from 2016 to 2026 by 274 faculty members who have at least one paper (roster 294), after removing 61 non-research records (meeting abstracts, ChemInform digests, news and comment pieces) and merging 26 duplicate versions (cleaning_log.csv). CDRI is largest with 2,684 papers and 117 faculty, against 821 papers and 49 faculty at IMTECH; lab counts add up to more than the total because shared papers are counted once under ALL. Of the 5,801 journal papers with a known quartile, 3,836 (66%) are Q1, from 76.6% at IMTECH to 62.2% at IGIB. Q1 papers in journals with impact factor above 5 number 1,236 (32% of Q1) and above 10 number 273 (7%), but 16% of papers lie within 10% of those lines, so these counts are sensitive. Papers with fewer than 10 authors are 77% and those with 10 to 99 are 23%; only 24 papers have 100 or more authors, yet they hold 12% of citations. Yearly output stays between 474 and 637 papers in 2016-2025, and 2026 (424) is partial. Collaborating institutions per year range from 354 to 2,046 when every paper counts but only 332 to 655 without 100+ author papers, so consortium papers drive the spikes (2016, 2021). The faculty-attributed papers are 75% of everything the four labs published: another 1,961 lab papers (22% of lab citations) have no roster scientist on them, mostly students, postdocs and staff, and are shown separately as lab-level totals.'
faculty: 'We find that citations are more concentrated than output across the 274 faculty. The ten most productive hold 16.6% of faculty-paper credits (1,340 of 8,064), while the ten most cited hold 23.5% of citations and the top 27 (10%) hold 43.9%. Sidharth Chopra (184 papers), Mohammed Faruq and Vinod Scaria lead on papers; G. Swarup, Puran Singh Sijwali and G R Chandak on citations; and Kalyan Mitra (53 co-authors among the faculty) and Jiaur R Gayen on co-author links. All ten most connected are at CDRI and none of them is in the top ten by citations. By number of partner institutions (without 100+ author papers) K Thangaraj (362) and G R Chandak (284) lead. Forty faculty are flagged (15 by the 100+ author rule, 37 by the 10+ author rule, 12 by both), including 8 of the ten most cited, and they hold 34% of all faculty citations. Without the flagged, Ritushree Kukreti, Gajendra P. S. Raghava and Naibedya Chattopadhyay head the list. IGIB has the highest flag rate (18 of 54). One further flag checks lifetime totals: Ashish Awasthi (CDRI) shows 117,443 lifetime citations on OpenAlex but 8 in our window, which points to a merged profile of a namesake, so lifetime totals should not be quoted for him. Caveat: 31 faculty have under five papers, so their ratios are unstable.'
journals: 'Across 6,013 journal papers, Scientific Reports is the most used venue (182 papers, 3.0%) and ranks first for CCMB, IGIB and IMTECH, but CDRI differs: its leading journals are chemistry titles, European Journal of Medicinal Chemistry (59), Organic Letters (56) and The Journal of Organic Chemistry (46). Publishing is diffuse, with the ten most used journals holding 712 papers (11.8%). The impact factor distribution is right-skewed: 1,286 papers (21%) are in journals above IF 5, 278 (4.6%) above 10 and 41 at 20 or more. The top 30 is filled by a few elite journals (11 Nature, 6 Science, 3 Cell, 2 Nature Medicine), with IF 29 to 88.5; ten of the 30 have 100 or more authors (up to 632), 18 involve a CCMB author, 8 IGIB, 7 CDRI and none IMTECH. The Lancet is now matched through its print ISSN, and a Lancet correspondence item is kept in the counts but not ranked. Caveat: JCR covers 1,389 of 1,573 journals; ranking by Scimago or OpenAlex citedness instead puts 1,979 rather than 1,236 Q1 papers above IF 5, while the count above 10 moves less (339 versus 273).'
networks: 'Among the 45 most connected Indian partner institutions, medical institutes carry the most joint papers with the labs (671 of 2,599 lab-partner links, 26%), ahead of other CSIR labs (464), other universities (357) and central universities (323); IITs add only 85 (67 with CDRI, none with IMTECH). Each lab has its own leading partner: AIIMS for IGIB (230 papers), KGMU for CDRI (132), IICT for CCMB (96) and Panjab University for IMTECH (72). Yet 30 of the 45 partners have joint papers with all four labs and one with a single lab, so the pool is shared while the weight is lab-specific. The faculty network grows from 128 linked faculty in 2016 to 253 cumulatively, the largest component rising from 45% to 96%, with density 0.026 to 0.041. It has 32 communities (modularity 0.53), the five largest each dominated by one lab, and only 94 of 1,308 links (7.2%) cross labs. Of 9,660 citations among our papers, 96.4% stay within a lab. Indian citations into the labs overtook those going out in 2022 and the gap has widened since (5,701 in against 3,868 out in 2025), which fits a maturing body of work being taken up by others. The 2021 link spike (345 links, 226 new) follows the COVID-19 genomics papers, and 2026 is partial.'
hyperauthorship: 'We find that the 1,410 papers with 10 or more authors are 23.4% of the 6,027 papers but carry 34.4% of the 143,701 citations, and the 24 papers with 100 or more authors are only 0.4% of papers yet hold 17,582 citations (12.2%). The two papers with over 1,000 authors, both autophagy guidelines, hold 5.9% of citations alone. Most of the 24 are genomics consortia (type 2 diabetes, lipids, height, BMI), SARS-CoV-2 virology and cohort papers, seven of them in Nature. Fifteen of the 219 faculty with at least 100 citations are flagged for drawing 25% or more of their citations from such papers: 6 at CCMB, 6 at IGIB, 3 at IMTECH and none at CDRI; 40 faculty are flagged under either rule. If the 100+ author papers are set aside, the four faculty ranked 1 to 4 by citations fall to ranks 46 to 146, and only 5 of the top 10 stay in the top 10. The same holds for the lab role: papers where a lab author is only a middle author are 23% of papers but 34% of citations (54% at CCMB). Within the same team-size band, though, they are cited no more than lab-led papers (median field-normalised citations 0.50-0.59 against 0.47-0.65 for 5 to 14 authors), so the gap is team size, not the lab''s role. We recommend reporting citations with and without these papers, and fractional counting for faculty rankings.'
citers: 'Raw counts make private universities look like heavy citers, but most of that is size. After dividing each institution''s citations to the labs by its own output (articles and reviews of 2016-2026 in the labs'' main fields), none of the 18 flagged non-government institutions is an outlier: the highest, GLA University, cites 2.8 times its expected count but has a robust z-score of 1.1 against a cut-off of 2, and no flagged institution crosses any cut-off from 1.5 to 3 or with an all-fields denominator. Across 341 institutions, government and private institutions have the same median of 50 citations per 1,000 papers (n = 225 and 104), and the rank correlation between raw counts and rates is only 0.35. Saveetha''s 736 citations come from 15,535 papers, about 1.2 times what its size predicts. Counts now leave out citations a lab paper makes to itself or to another lab paper; with those in, the totals are about 20% higher. The real outliers are government institutes close to the labs'' fields: IIIT Delhi, THSTI, NEERI and the NIPER campuses at Hyderabad and Raebareli, all of which also co-author with the labs. Among the flagged institutions, 21-58% of citing papers are reviews and up to 17% are book chapters, and up to 9% of citing papers have a current or former lab scientist among their authors, which explains part of the rest. Limits: OpenAlex counts; ownership was classified for 379 institutions (174 checked against official pages on 2026-11-20); the z cut-off is a convention.'
research: 'Five results hold against randomised baselines. (1) Lab, not department, organises collaboration: 4.8% of 1,250 faculty links cross labs against 71% if lab labels were shuffled (z = -34), and in a logistic model being in the same lab multiplies the odds of a link 55 times after topic similarity and output, while sharing a department adds nothing measurable (odds 1.18, 95% CI 0.93-1.48). Clustering is 2.6 times and the rich club 1.6 times that of degree-preserving rewired networks. (2) Citations among our papers are mostly self-citation: 92% of the 9,660 internal citations share an author, and PageRank on raw citations puts self-cited CDRI papers on top; with those removed, the Simons Genome Diversity Project, a paper on population-specific disease genes in South Asia and a CDRI C. elegans alpha-synuclein study lead. (3) Even independent citations stay home: 74% are within the lab against 55% expected for papers of the same year and fields (observed over expected 1.26-1.69 per lab). (4) Social proximity decays fast: independent citations are 2.0 times more likely than chance between direct co-authors and 1.4 times at two steps, but fall below chance from three steps on. (5) Cross-lab ties are fragile: 12% of new cross-lab pairs repeat within three years against 34% of new same-lab pairs (Fisher p = 0.008), and a shared co-author raises the chance of a new link about 16-fold. Controlling for year, field, team size and reviews, IMTECH papers draw 11% more citations than CDRI''s (95% CI 2-20%) and IGIB''s 18% fewer; each doubling of team size goes with about 29% more citations. COVID-19 work was 26% of IGIB''s 2021 papers and 47% of its 2022 citations. These are observational associations from OpenAlex data, not causal effects.'
